<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
</head>
<body>
  <h1>Admin - Upload Fish</h1>
  <form id="uploadForm" enctype="multipart/form-data">
    <input type="text" name="fishName" placeholder="Fish Name" required><br>
    <input type="text" name="placeOfCatch" placeholder="Place of Catch" required><br>
    <input type="text" name="catchLocation" placeholder="Catch Location" required><br>
    <label>QR Image:</label><input type="file" name="qrImage" required><br>
    <label>Fish Image:</label><input type="file" name="fishImage" required><br>
    <button type="submit">Upload</button>
  </form>

  <h2>Manage Entries</h2>
  <div id="fishList"></div>

  <script src="script.js"></script>
</body>
</html>
